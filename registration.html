        { title: "Aiyana Twigg", url: "../../presenters/twigg.html", keywords: "aiyana twigg twigg speaker presenter" },
        { title: "Jessica Starlund", url: "../../presenters/starlund.html", keywords: "jessica starlund starlund speaker presenter" },
        { title: "Heather Bliss", url: "../../presenters/bliss.html", keywords: "heather bliss bliss speaker presenter" },
        { title: "Jasḵwaan A. Bedard", url: "../../presenters/bedard.html", keywords: "jasḵwaan bedard jaskwaan a bedard bedard speaker presenter" },
        { title: "Katherine Schmirler", url: "../../presenters/schmirler.html", keywords: "katherine schmirler schmirler speaker presenter" },
        { title: "Nikita Gionet", url: "../../presenters/gionet.html", keywords: "nikita gionet gionet speaker presenter" },
        { title: "Jessica Sangris", url: "../../presenters/sangris.html", keywords: "jessica sangris sangris speaker presenter" },
        { title: "Tiffany Prete", url: "../../presenters/prete.html", keywords: "tiffany prete prete speaker presenter" },
        { title: "Niitsitapi Pod Abundant Intelligence Group", url: "../../presenters/niitsitapi-pod.html", keywords: "niitsitapi pod abundant intelligence group presenters speakers" },
        
        { title: "Organizers", url: "../../organizers/overview.html", keywords: "organizers organizing committee conference team carter provost inge genee annabelle chatsis caroline russell mary fox alex smith jocelyn mcknight aj junkar meghan garner jamie foster nabeel al jahan" },
        { title: "Inge Genee", url: "../../organizers/genee.html", keywords: "inge genee genee piitaakii organizer organizing committee" },
        { title: "Annabelle Chatsis", url: "../../organizers/chatsis.html", keywords: "annabelle chatsis chatsis organizer organizing committee" },
        { title: "Caroline Russell", url: "../../organizers/russell.html", keywords: "caroline russell russell organizer organizing committee" },
        { title: "Mary Fox", url: "../../organizers/fox.html", keywords: "mary fox fox organizer organizing committee" },
        { title: "Alex Smith", url: "../../organizers/smith.html", keywords: "alex smith smith organizer organizing committee" },
        { title: "Jocelyn McKnight", url: "../../organizers/mcknight.html", keywords: "jocelyn mcknight mcknight organizer organizing committee" },

    ];

    function openSearch() {
      body.classList.add('search-open');
      search.setAttribute('aria-hidden', 'false');
      searchOverlay.setAttribute('aria-hidden', 'false');
      searchInput.value = '';
      searchResults.innerHTML = '';
      searchInput.focus();
    }

    function closeSearch() {
      body.classList.remove('search-open');
      search.setAttribute('aria-hidden', 'true');
      searchOverlay.setAttribute('aria-hidden', 'true');
      searchBtn.focus();
    }

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, s => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[s]));
    }

    function runSearch(q){
      const query = q.trim().toLowerCase();
      if(!query){
        searchResults.innerHTML = "";
        return;
      }

      const results = searchIndex.filter(item => {
        const hay = (item.title + " " + item.keywords).toLowerCase();
        return hay.includes(query);
      }).slice(0, 12);

      if(results.length === 0){
        searchResults.innerHTML = `<p class="search__empty">No results for “${escapeHtml(q)}”.</p>`;
        return;
      }

      searchResults.innerHTML = `
        <ul class="search__list">
          ${results.map(r => `
            <li class="search__item">
              <a class="search__link" href="${r.url}">${escapeHtml(r.title)}</a>
              <span class="search__url">${escapeHtml(r.url)}</span>
            </li>
          `).join("")}
        </ul>
      `;
    }

    searchBtn.addEventListener('click', openSearch);
    searchClose.addEventListener('click', closeSearch);
    searchOverlay.addEventListener('click', closeSearch);
    searchInput.addEventListener('input', (e) => runSearch(e.target.value));

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && body.classList.contains('search-open')) closeSearch();
    });
  </script>
